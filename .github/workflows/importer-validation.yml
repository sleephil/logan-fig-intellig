name: FIG importer validation
on:
  push:
    branches: [work/fig-importer-20261113]
    paths: [.github/workflows/importer-validation.yml, '.release-build/**']
permissions:
  contents: write
concurrency:
  group: fig-importer-isolated
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fig_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fig_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fig_test
      SEC_USER_AGENT: Logan Capital Management FIG Research sslee@logancapital.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact candidate on unchanged production
        run: |
          cp -R .release-build /tmp/fig-build
          test "$(git rev-parse origin/main)" = cd6135c81adb423ab1950f672066fd6a9a6d5fcd
          git switch --detach cd6135c81adb423ab1950f672066fd6a9a6d5fcd
          git switch -c release/fig-importer-20261113
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,json,ast
          encoded=''.join((Path('/tmp/fig-build')/('candidate.part'+str(i))).read_text().strip() for i in (1,2))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='2dd289d56ae8f1276aa6a653ec60726cce4763f1938dca91e5845861416485f2','Candidate transport mismatch'
          files=json.loads(raw)
          expected={'.github/workflows/ci.yml','CHANGELOG.json','CHANGELOG.md','analysis.py','app.py','docs/importer.md','ingest.py','requirements.txt','storage.py','tests/test_ingest.py','tests/test_postgres.py','verify_live_sources.py','version.py','worker.py'}
          assert set(files)==expected
          name='.github/workflows/ci.yml'
          files[name]=files[name].replace("--health-cmd 'pg_isready -U postgres -d fig_test'",'--health-cmd "pg_isready -U postgres -d fig_test"')
          assert hashlib.sha256(files[name].encode()).hexdigest()=='f3fdadbc8edde18fc0a849a225b74937c2b4f96cd7bda35fe609f61d1f18a0f1'
          manifest={}
          for name,text in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              if name.endswith('.py'):ast.parse(text)
              manifest[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('/tmp/fig-manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Reconstructed exact fourteen-file importer candidate')
          PY
          git diff --check
      - run: python -m pip install -r requirements.txt pip-audit
      - name: Blocking dependency audit and production imports
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          python -m compileall -q app.py storage.py ingest.py analysis.py worker.py version.py
          python -c "import app; print(app.release())"
      - name: All importer, authorization and PostgreSQL tests
        run: python -m pytest tests -q --junitxml=/tmp/fig-tests.xml
      - name: Real SEC XML and ZIP reconciliation plus independent database and API readback
        run: python verify_live_sources.py
      - name: Publish only validated candidate branch
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = cd6135c81adb423ab1950f672066fd6a9a6d5fcd
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          expected=json.loads(Path('/tmp/fig-manifest.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in expected.items())
          subprocess.run(['git','add','--',*expected],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          PY
          git diff --cached --check
          git config user.name 'Logan Release Validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair and verify SEC XML and ZIP importer with durable progress and versioned change records'
          git push origin HEAD:refs/heads/release/fig-importer-20261113
          git rev-parse HEAD > /tmp/fig-release-sha.txt
          python -m pip freeze > /tmp/fig-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fig-importer-validation
          path: |
            /tmp/fig-tests.xml
            /tmp/fig-live-verification.json
            /tmp/fig-manifest.json
            /tmp/fig-release-sha.txt
            /tmp/fig-dependencies.txt
          retention-days: 30
