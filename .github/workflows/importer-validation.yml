name: FIG importer validation
on:
  push:
    branches: [work/fig-importer-20261113]
    paths: [.github/workflows/importer-validation.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot unchanged source
        run: |
          mkdir -p /tmp/fig-inspect
          git archive --format=tar.gz --output=/tmp/fig-inspect/source.tar.gz cd6135c81adb423ab1950f672066fd6a9a6d5fcd
      - name: Check official SEC XML and ZIP paths without any production credentials
        run: |
          python - <<'PY'
          import urllib.request,json,time,zipfile,io,csv,hashlib
          from pathlib import Path
          out=Path('/tmp/fig-inspect')
          ua='Logan Capital Management FIG Research sslee@logancapital.com'
          urls={'submissions':'https://data.sec.gov/submissions/CIK0001269119.json','bulk_index':'https://www.sec.gov/data-research/sec-markets-data/form-13f-data-sets','bulk_zip':'https://www.sec.gov/files/datastandardsinnovation/data/form-13f-data-sets/01jun2026-31aug2026_form13f.zip'}
          receipt={}
          for name,url in urls.items():
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':ua})
                  with urllib.request.urlopen(request,timeout=60) as response: data=response.read(160_000_001)
                  if len(data)>160_000_000: raise ValueError('Download limit exceeded')
                  receipt[name]={'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                  if name=='submissions':
                      (out/'submissions.json').write_bytes(data)
                      j=json.loads(data);receipt[name]['filer']=j.get('name')
                      a=j['filings']['recent']; entries=[dict(zip(a,values)) for values in zip(*a.values())]
                      matches=[e for e in entries if e['form'] in ('13F-HR','13F-HR/A')]
                      receipt[name]['recent_filings']=matches[:5]
                      if matches:
                          e=matches[0];base='https://www.sec.gov/Archives/edgar/data/1269119/'+e['accessionNumber'].replace('-','')+'/'
                          time.sleep(.5)
                          try:
                              with urllib.request.urlopen(urllib.request.Request(base+'index.json',headers={'User-Agent':ua}),timeout=30) as r: idx=json.load(r)
                              (out/'filing-index.json').write_text(json.dumps(idx))
                              for item in idx['directory']['item']:
                                  n=item['name']
                                  if n.lower().endswith('.xml') and '/' not in n:
                                      time.sleep(.5)
                                      with urllib.request.urlopen(urllib.request.Request(base+n,headers={'User-Agent':ua}),timeout=30) as r: x=r.read(15_000_001)
                                      if len(x)>15_000_000:raise ValueError('XML limit')
                                      (out/n).write_bytes(x)
                          except Exception as err:receipt['individual_xml_error']=str(err)
                  elif name=='bulk_index':(out/'bulk-index.html').write_bytes(data)
                  else:
                      z=zipfile.ZipFile(io.BytesIO(data));receipt[name]['members']=[{'name':i.filename,'size':i.file_size} for i in z.infolist()]
                      selected=set(); meta={}
                      for n in z.namelist():
                          if n.upper().endswith('SUBMISSION.TSV'):
                              with z.open(n) as f:
                                  rows=csv.DictReader(io.TextIOWrapper(f,encoding='utf-8-sig'),delimiter='\t')
                                  receipt[name]['submission_fields']=rows.fieldnames
                                  for r in rows:
                                      if str(r.get('CIK','')).lstrip('0')=='1269119':meta[r['ACCESSION_NUMBER']]=r;selected.add(r['ACCESSION_NUMBER'])
                      for n in z.namelist():
                          if n.upper().endswith(('.TSV','.TXT')) and 'README' not in n.upper():
                              with z.open(n) as f:
                                  rows=csv.DictReader(io.TextIOWrapper(f,encoding='utf-8-sig'),delimiter='\t')
                                  fields=rows.fieldnames
                                  if not fields or 'ACCESSION_NUMBER' not in fields:continue
                                  destination=out/Path(n).name
                                  with destination.open('w',newline='') as sink:
                                      writer=csv.DictWriter(sink,fieldnames=fields,delimiter='\t');writer.writeheader()
                                      for r in rows:
                                          if r.get('ACCESSION_NUMBER') in selected:writer.writerow(r)
                      receipt[name]['selected_accessions']=sorted(selected)
              except Exception as exc:receipt[name]={'url':url,'error':str(exc)}
              time.sleep(.5)
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fig-importer-inspection
          path: /tmp/fig-inspect/
          retention-days: 7
