name: Manager report release validation
on:
  push:
    branches: [work/manager-report-20261113]
    paths: [.github/workflows/manager-release.yml, '.release-build/**']
permissions:
  contents: write
concurrency:
  group: fig-manager-release
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fig_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fig_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fig_test
      SEC_USER_AGENT: 'Logan Capital Management sslee@logancapital.com'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct and verify candidate including release contract tests
        run: |
          cp -R .release-build /tmp/manager-build
          test "$(git rev-parse origin/main)" = 8adf038769c4e5192f881813023976576ea503ec
          git switch --detach 8adf038769c4e5192f881813023976576ea503ec
          git switch -c release/manager-report-20261113
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib,subprocess,ast
          raw=lzma.decompress(base64.b64decode(Path('/tmp/manager-build/manager.patch.xz64').read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='a40e17a5786c672c6b3a4b673d660d67da4f6705e56c87a361af7bb78e574259'
          payload=json.loads(raw);expected=payload['hashes']
          allowed={'app.py','manager_reporting.py','tests/test_managers.py','verify_manager_sources.py','version.py','CHANGELOG.md','CHANGELOG.json','docs/importer.md'}
          assert set(expected)==allowed
          patch=payload['patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for p,h in expected.items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
              if p.endswith('.py'):ast.parse(Path(p).read_text())
          Path('/tmp/manager-manifest.json').write_text(json.dumps(expected,indent=2))
          PY
          python /tmp/manager-build/refine.py
          git diff --check
      - run: python -m pip install -r requirements.txt pip-audit==2.9.0
      - name: Security and all importer manager API regressions
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          python -m compileall -q .
          python -m pytest tests -q --disable-warnings --junitxml=/tmp/manager-tests.xml
      - name: Real SEC manager totals and independent committed API readback
        run: python verify_manager_sources.py
      - name: Publish exact validated source without helper workflows
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = 8adf038769c4e5192f881813023976576ea503ec
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          expected=json.loads(Path('/tmp/manager-manifest.json').read_text())
          assert set(expected)=={'app.py','manager_reporting.py','tests/test_managers.py','tests/test_ingest.py','verify_manager_sources.py','version.py','CHANGELOG.md','CHANGELOG.json','docs/importer.md'}
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in expected.items())
          subprocess.run(['git','add','--',*expected],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(expected)
          PY
          git diff --cached --check
          git config user.name 'Logan Release Validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIG 0.3.0: manager-linked assets, historical trends and exploratory paired changes'
          git push origin HEAD:refs/heads/release/manager-report-20261113
          git rev-parse HEAD > /tmp/manager-release.txt
          git archive --format=tar.gz HEAD > /tmp/manager-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-report-release-validation
          retention-days: 30
          path: |
            /tmp/manager-tests.xml
            /tmp/manager-manifest.json
            /tmp/manager-live-evidence.json
            /tmp/manager-live-report.json
            /tmp/manager-release.txt
            /tmp/manager-source.tar.gz
