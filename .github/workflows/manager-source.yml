name: Manager report source validation
on:
  push:
    branches: [work/manager-report-20261113]
    paths: [.github/workflows/manager-source.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SEC_USER_AGENT: 'Logan Capital Management sslee@logancapital.com'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Save baseline and real public filing snapshots without a production database
        run: |
          mkdir -p /tmp/manager-sources
          git archive --format=tar.gz 8adf038769c4e5192f881813023976576ea503ec > /tmp/manager-sources/backend.tar.gz
          python - <<'PY'
          from ingest import SECClient,submissions,filing
          from dataclasses import asdict
          from pathlib import Path
          import json
          c=SECClient(); cik='0001269119'
          snapshots=[asdict(filing(cik,e,c)) for e in submissions(cik,c)]
          Path('/tmp/manager-sources/snapshots.json').write_text(json.dumps(snapshots))
          print(json.dumps([{'period':s['period'],'managers':len(s['managers']),'rows':len(s['rows'])} for s in snapshots]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manager-report-sources
          path: /tmp/manager-sources/
          retention-days: 7
